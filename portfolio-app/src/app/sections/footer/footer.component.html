<footer class="pf-footer" role="contentinfo">
  <div class="pf-container pf-footer__inner">
    <p class="pf-footer__copyright">{{ copyright }}</p>

    <ul class="pf-footer__socials">
      <li *ngFor="let social of socials">
        <a
          [href]="social.url"
          [attr.aria-label]="social.label"
          target="_blank"
          rel="noopener noreferrer"
          appMagneticCursor
        >
          <mat-icon aria-hidden="true">{{ social.icon }}</mat-icon>
        </a>
      </li>
    </ul>
  </div>
</footer>
