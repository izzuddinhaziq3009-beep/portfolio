<div class="pf-profile-card" aria-label="Profile">
  <div class="pf-profile-card__avatar">
    <img
      *ngIf="!imageFailed"
      [src]="hero.profileImageUrl"
      [alt]="hero.name + ' profile photo'"
      (error)="onImageError()"
    />
    <span *ngIf="imageFailed" class="pf-profile-card__fallback" aria-hidden="true">{{ initials }}</span>
  </div>

  <p class="pf-profile-card__name">{{ hero.name }}</p>
  <p class="pf-profile-card__tagline">{{ hero.tagline }}</p>

  <ul class="pf-profile-card__socials">
    <li *ngFor="let social of socials">
      <a
        [href]="social.url"
        [attr.aria-label]="social.label"
        target="_blank"
        rel="noopener noreferrer"
        appMagneticCursor
      >
        <mat-icon aria-hidden="true">{{ social.icon }}</mat-icon>
      </a>
    </li>
  </ul>
</div>
